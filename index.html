<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Turkey Day Trophic Trap · Hutchins-Trapp Estate Escape Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700;9..144,900&family=Caveat:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#130c08; --panel:#24180f; --panel2:#322216; --ink:#f6ead8; --muted:#c7b199;
  --pumpkin:#e07a2f; --cran:#c4334a; --gold:#e8b44a; --sage:#8fb27a; --teal:#6fc3c9; --line:#4e3524;
  --display:'Fraunces',Georgia,'Times New Roman',serif;
  --body:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.55}
body{min-height:100vh;background:radial-gradient(1200px 600px at 50% -10%,rgba(224,122,47,.16),transparent 60%),var(--bg)}
#leaves{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.leaf{position:absolute;top:-40px;opacity:.45;animation:fall linear infinite}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(40px,50vh) rotate(180deg)}100%{transform:translate(-30px,105vh) rotate(360deg)}}
#app{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:14px 14px 50px}

/* HUD */
.hud{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;
  background:rgba(30,20,13,.94);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:14px;padding:8px 14px;margin-bottom:12px}
.hud[hidden]{display:none}
.estate{font-family:var(--display);font-weight:700;color:var(--gold);line-height:1.1}
.estate small{display:block;font-family:var(--body);font-weight:500;font-size:.68rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.stat-row{display:flex;gap:16px;align-items:center}
.hud-item{text-align:center}
.hud-item .label{display:block;font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hud-item .val{font-size:1.05rem;letter-spacing:.08em}
#timer{font-family:var(--mono);font-weight:700;font-size:1.25rem;color:var(--gold)}
#timer.urgent{color:var(--cran);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.45}}
.hud-btns{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hud-btns input{width:70px;accent-color:var(--pumpkin)}
#foodStatus{flex-basis:100%;font-size:.8rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:5px;text-align:center}

button{font-family:var(--body);font-weight:600;font-size:.92rem;border-radius:10px;border:1px solid var(--line);
  background:var(--panel2);color:var(--ink);padding:9px 14px;cursor:pointer;transition:transform .08s,background .2s,border-color .2s}
button:hover{border-color:var(--pumpkin)}
button:active{transform:translateY(1px)}
button.primary{background:linear-gradient(180deg,#e88a40,#c9621d);border-color:#f19a52;color:#1b0f07}
button.ghost{background:transparent}
button.small{padding:5px 9px;font-size:.78rem}
button:disabled{opacity:.4;cursor:not-allowed}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--pumpkin);color:#1b0f07;font-size:.7rem;margin-left:4px}


/* scene animation */
.steam{animation:steam 4s ease-in-out infinite}
@keyframes steam{0%{opacity:0;transform:translateY(8px)}35%{opacity:.35}100%{opacity:0;transform:translateY(-34px)}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flame .18s ease-in-out infinite alternate}
@keyframes flame{from{transform:scale(1,1) skewX(-3deg)}to{transform:scale(.88,1.12) skewX(3deg)}}
.shimmer{animation:shimmer 2.4s ease-in-out infinite alternate}
@keyframes shimmer{from{opacity:.15;transform:translateX(-3px)}to{opacity:.55;transform:translateX(3px)}}
.pulseRed{animation:pulseRed 1.4s ease-in-out infinite}
@keyframes pulseRed{50%{opacity:.25}}
.mist{animation:mist 7s ease-in-out infinite alternate}
@keyframes mist{from{transform:translate(-10px,0);opacity:.5}to{transform:translate(18px,14px);opacity:1}}
.mote{animation:mote 9s linear infinite}
@keyframes mote{0%{transform:translate(0,0);opacity:0}20%{opacity:.8}100%{transform:translate(30px,60px);opacity:0}}
.ray{animation:ray 6s ease-in-out infinite alternate}
@keyframes ray{from{opacity:.55}to{opacity:1}}
.blink{animation:pulseRed 1.8s steps(2) infinite}
.fallleaf{animation:leaffall 10s linear infinite}
@keyframes leaffall{0%{transform:translate(var(--x,0),-20px) rotate(0)}100%{transform:translate(calc(var(--x,0) + 60px),580px) rotate(540deg)}}
.ember{animation:ember 1.6s ease-in-out infinite alternate}
@keyframes ember{from{opacity:.25}to{opacity:1}}
.spark{animation:spark 6s linear infinite}
@keyframes spark{0%{transform:translate(0,0);opacity:0}10%{opacity:1}100%{transform:translate(20px,-300px);opacity:0}}
.smoke{animation:smoke 10s ease-in-out infinite alternate}
@keyframes smoke{from{transform:translate(0,20px)}to{transform:translate(30px,-30px)}}
.holo{animation:holo 3.2s ease-in-out infinite}
@keyframes holo{0%,100%{transform:translateY(0);opacity:.85}50%{transform:translateY(-6px);opacity:.55}}
.lampglow{animation:ray 3s ease-in-out infinite alternate}
@media (prefers-reduced-motion: reduce){.scene *{animation:none!important}}


/* ---- immersion layer ---- */
.cam{position:relative}
.cam.push{animation:push 1.4s cubic-bezier(.2,.7,.2,1)}
@keyframes push{from{transform:scale(1.09)}to{transform:scale(1)}}
.scene-wrap svg.scene{transform:scale(1.045) translate(calc(var(--px,0) * -11px),calc(var(--py,0) * -7px));transition:transform .35s ease-out;transform-origin:50% 50%}
#dim{position:absolute;inset:0;pointer-events:none;z-index:2;transition:background 2s ease}
#dim.red{animation:redPulse 1.7s ease-in-out infinite}
@keyframes redPulse{50%{box-shadow:inset 0 0 170px rgba(255,30,30,.5)}}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .38s ease;z-index:4}
#fade.on{opacity:1}
.o2{width:84px;height:8px;border-radius:4px;background:#2a1a10;overflow:hidden;border:1px solid var(--line);margin:5px auto 0}
.o2 i{display:block;height:100%;background:linear-gradient(90deg,#6fc3c9,#8fe0a0);transition:width 1s linear}
.o2.low i{background:linear-gradient(90deg,#c4334a,#e07a2f)}
.hs{cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='30' height='30'><circle cx='12' cy='12' r='8.5' fill='rgba(255,230,160,.25)' stroke='%23ffd98a' stroke-width='3'/><line x1='18.5' y1='18.5' x2='27' y2='27' stroke='%23ffd98a' stroke-width='4' stroke-linecap='round'/></svg>") 12 12, pointer}
.hs.door,.hs.lock{cursor:pointer}
.paper{position:relative;background:#f6efdc;color:#33261a;font-family:'Caveat',cursive;font-size:1.32rem;line-height:31px;padding:14px 20px 14px 46px;border-radius:3px;margin:14px 4px;
  box-shadow:0 12px 26px rgba(0,0,0,.5);transform:rotate(-.8deg);background-image:linear-gradient(90deg,transparent 34px,#e8a0a0 34px,#e8a0a0 36px,transparent 36px),repeating-linear-gradient(transparent 0 30px,#c3d2e4 30px 31px)}
.paper .hdr{font-family:var(--display);font-weight:700;font-size:1rem;color:#7a2a1a;letter-spacing:.04em;line-height:1.4}
.plaque{background:linear-gradient(135deg,#f6dc94,#c4943e 45%,#7a5a1a);color:#3a2408;font-family:var(--display);font-weight:700;text-align:center;padding:18px 20px;border-radius:12px;border:3px solid #6a4a18;
  box-shadow:inset 0 2px 0 #fff8,inset 0 -3px 6px rgba(0,0,0,.25),0 12px 26px rgba(0,0,0,.5);text-shadow:0 1px 0 #f8e6b0;margin:14px 0;letter-spacing:.03em;line-height:1.5}
.lcd{background:radial-gradient(ellipse at 50% 30%,#123a20,#06140a);border:7px solid #3a4048;border-radius:14px;padding:14px 18px;font-family:var(--mono);color:#8dff86;text-shadow:0 0 8px rgba(141,255,134,.65);
  box-shadow:inset 0 0 30px rgba(0,0,0,.85),0 0 0 2px #1a1e22,0 12px 26px rgba(0,0,0,.5);margin:14px 0;background-image:repeating-linear-gradient(transparent 0 2px,rgba(0,0,0,.18) 2px 3px)}
.lcd .hdr{color:#c8ffc0;font-weight:700;margin-bottom:6px;letter-spacing:.06em}
.lcd b{color:#eaffe0;font-size:1.3em}
svg.core{width:100%;height:auto;display:block;margin:10px 0;filter:drop-shadow(0 10px 18px rgba(0,0,0,.5))}
.narr .portrait.bump{animation:bump .55s ease}
@keyframes bump{40%{transform:scale(1.13) rotate(-5deg)}}
.breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 4.2s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.012,1.022)}}
.wag{transform-box:fill-box;transform-origin:0% 100%;animation:wag .45s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-10deg)}to{transform:rotate(12deg)}}
.pupbob{animation:pupbob 3.4s ease-in-out infinite}
@keyframes pupbob{50%{transform:translateY(-1.5px)}}
@media (hover:none){.scene-wrap svg.scene{transform:scale(1.02)}}
@media (prefers-reduced-motion: reduce){.cam.push,.scene-wrap svg.scene,#dim.red{animation:none!important;transition:none!important}}


.casefile{background:linear-gradient(180deg,#f3ead2,#e6d8b6);color:#2e2216;border-radius:10px;padding:12px 16px;margin:12px 0;box-shadow:0 10px 24px rgba(0,0,0,.45);border:1px solid #b89a62}
.casefile .cf-hdr{font-family:var(--mono);font-weight:700;font-size:.78rem;letter-spacing:.08em;color:#7a2a1a;margin-bottom:6px}
.casefile .cf-item{padding:7px 0;border-top:1px dashed #b89a62;font-size:.95rem}
.casefile .cf-item b{color:#5a1a0a}
.casefile .cf-item.miss{color:#7a5a3a}
.casefile .cf-more{font-size:.8rem;color:#7a5a3a;font-style:italic;padding-top:6px;border-top:1px dashed #b89a62}
.casefile .chart-wrap,.casefile .passport{box-shadow:none}
/* map */
.map{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.map button{flex:1;min-width:120px;font-size:.8rem;padding:7px 8px;background:var(--panel)}
.map button.here{border-color:var(--gold);background:rgba(232,180,74,.14);color:var(--gold)}
.map button:disabled{opacity:.35}

/* scene */
.scene-wrap{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.45);background:#000}
.scene-wrap svg.scene{display:block;width:100%;height:auto;animation:fadein .7s ease}
@keyframes fadein{from{opacity:0;filter:blur(4px)}to{opacity:1;filter:none}}
.scene-wrap::after{content:'';position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 140px rgba(0,0,0,.7)}
.scene-wrap.flicker svg.scene{animation:flick .7s steps(2)}
@keyframes flick{0%,100%{filter:none}20%{filter:brightness(.35)}40%{filter:brightness(1.1)}60%{filter:brightness(.5)}}
.room-title{position:absolute;left:14px;top:10px;z-index:2;font-family:var(--display);font-weight:700;font-size:clamp(1rem,2.6vw,1.5rem);
  text-shadow:0 2px 10px #000;color:var(--ink)}
.room-title small{display:block;font-family:var(--body);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.hs{cursor:pointer;outline:none}
.hs .hit{fill:transparent}
.hs:hover .hit,.hs:focus .hit{fill:rgba(255,217,138,.10);stroke:rgba(255,217,138,.5);stroke-width:2;stroke-dasharray:6 6}
.hs .ring{fill:none;stroke:#ffd98a;stroke-width:2.5;transform-box:fill-box;transform-origin:center;animation:ring 2.2s infinite}
@keyframes ring{0%{transform:scale(.7);opacity:.95}75%{transform:scale(1.9);opacity:0}100%{opacity:0}}
.hs .core{fill:#ffd98a;stroke:#2a1a0c;stroke-width:2}
.hs.lock .core{fill:var(--pumpkin)} .hs.lock .ring{stroke:var(--pumpkin)}
.hs.door .core{fill:var(--teal)} .hs.door .ring{stroke:var(--teal)}
.hs.done .ring{animation:none;opacity:0}
.hs.done .core{fill:var(--sage)}
.hs .lbl{opacity:0;transition:opacity .2s;pointer-events:none}
.hs:hover .lbl,.hs:focus .lbl{opacity:1}
.lbl rect{fill:rgba(10,6,4,.88);stroke:#ffd98a;stroke-width:1}
.lbl text{fill:#ffe6b0;font:600 15px var(--body)}

.narr{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;margin-top:12px;background:linear-gradient(180deg,var(--panel),#1d130c);
  border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.narr .portrait{width:64px;height:64px;border-radius:50%;border:2px solid var(--gold);background:#f3c66a}
#narrText{min-height:3.2em;font-size:1rem}
#narrText .cursor{display:inline-block;width:8px;background:var(--gold);animation:pulse .8s infinite;margin-left:2px}
.objective{margin-top:6px;font-size:.85rem;color:var(--gold)}
.objective b{color:var(--pumpkin)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips .lead{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);align-self:center;margin-right:4px}
.chips button{font-size:.78rem;padding:5px 10px;background:var(--panel)}
.chips button.done{color:var(--sage);border-color:rgba(143,178,122,.5)}
.chips button.lock{border-color:var(--pumpkin)}
.chips button.door{border-color:rgba(111,195,201,.6)}

/* cards / text */
.card{background:linear-gradient(180deg,var(--panel),#1d130c);border:1px solid var(--line);border-radius:18px;padding:26px 28px;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:rise .45s ease}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.kicker{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--pumpkin);font-weight:600}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:.2em 0 .4em}
h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:900}
h1 .accent{color:var(--pumpkin)}
h2{font-size:clamp(1.35rem,3vw,1.9rem)}
h3{font-size:1.1rem;color:var(--gold)}
.unit-tag{display:inline-block;font-size:.7rem;font-weight:600;border:1px solid var(--sage);color:var(--sage);border-radius:999px;padding:2px 10px;margin-bottom:6px}
.say{display:flex;gap:10px;align-items:flex-start;border-left:3px solid var(--gold);padding:8px 12px;margin:12px 0;background:rgba(232,180,74,.07);border-radius:0 10px 10px 0}
.say img{width:40px;height:40px;border-radius:50%;flex:none;border:1.5px solid var(--gold);background:#f3c66a}
.say .bot{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;background:#0c2f33;border:1.5px solid var(--teal);font-size:1.2rem}
.say b{color:var(--gold)}
.say.ai{border-left-color:var(--teal);background:rgba(111,195,201,.07)}
.say.ai b{color:var(--teal)}
.terminal{font-family:var(--mono);background:#0b0806;border:1px solid #3a2a1c;border-radius:12px;padding:14px 16px;margin:12px 0;font-size:.86rem;color:#f3d9b5}
.terminal .hdr{color:var(--pumpkin);font-weight:700;margin-bottom:6px;letter-spacing:.05em}
.prompt{font-family:var(--mono);font-weight:700;color:var(--cran)}
.lab{background:rgba(143,178,122,.08);border:1px solid rgba(143,178,122,.4);border-radius:12px;padding:12px 16px;margin:12px 0}
.lab b{color:var(--sage)}

/* modal */
#modal{position:fixed;inset:0;z-index:50;background:rgba(5,3,2,.78);display:none;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
#modal.open{display:flex}
.modal-card{position:relative;width:100%;max-width:780px;background:linear-gradient(180deg,#2a1c12,#1a110b);border:1px solid var(--line);border-radius:18px;padding:22px 24px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:rise .3s ease}
.modal-close{position:absolute;right:12px;top:10px;background:transparent;border:none;font-size:1.4rem;color:var(--muted);padding:4px 8px}
.answer{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.answer input{flex:1;min-width:180px;font-family:var(--mono);font-size:1.1rem;letter-spacing:.08em;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:#0b0806;color:var(--gold)}
.answer input:focus{outline:2px solid var(--pumpkin);outline-offset:1px}
details.field{border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:10px 0;background:rgba(0,0,0,.2)}
details.field summary{cursor:pointer;font-weight:600;color:var(--gold)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.offline{border:1px dashed var(--cran);border-radius:12px;padding:12px 14px;color:#f1b3bd;background:rgba(196,51,74,.08)}

/* toast */
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%) translateY(-120%);z-index:60;background:#0c2f33;border:1px solid var(--teal);color:#d9f4f6;
  border-radius:12px;padding:10px 16px;font-size:.9rem;max-width:min(560px,92vw);transition:transform .35s ease;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#toast.show{transform:translateX(-50%) translateY(0)}

/* chart, passports, ordering */
.chart-wrap{background:#0b0806;border:1px solid #3a2a1c;border-radius:12px;padding:8px;margin:10px 0}
svg.chart{width:100%;height:auto;display:block}
.grid{stroke:#3a2a1c;stroke-width:1} .grid.minor{stroke:#251a11;stroke-dasharray:3 4}
.axis{stroke:#7a5a40;stroke-width:1.2}
.axl{fill:#c7b199;font-family:var(--mono);font-size:12px}
.axt{fill:#f6ead8;font-family:var(--body);font-size:13px;font-weight:600}
.line{fill:none;stroke:var(--pumpkin);stroke-width:3;stroke-linejoin:round}
.dot{fill:var(--gold);stroke:#0b0806;stroke-width:2}
.passports{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px;margin:10px 0}
.passport{background:#0b0806;border:1px solid #3a2a1c;border-radius:12px;padding:10px}
.passport .seat{font-family:var(--mono);color:var(--pumpkin);font-size:.75rem;font-weight:700}
.passport .nation{font-family:var(--display);font-weight:700;font-size:1.05rem}
.passport .guest{font-size:.74rem;color:var(--muted);margin-bottom:4px}
.passport table{width:100%;font-family:var(--mono);font-size:.74rem;border-collapse:collapse}
.passport td{padding:2px 0;border-bottom:1px solid #22180f}
.passport td:last-child{text-align:right;color:var(--gold)}
svg.pyr{width:100%;height:auto;display:block;margin-top:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:12px 0}
.plant{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;font-weight:500;font-size:.84rem;line-height:1.3}
.plant .ico{font-size:1.5rem;display:block;margin-bottom:3px}
.plant.used{opacity:.28;pointer-events:none}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
.slot{min-height:78px;border:2px dashed var(--line);border-radius:12px;padding:6px;font-size:.72rem;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;color:var(--muted)}
.slot.filled{border-style:solid;border-color:var(--sage);color:var(--ink);background:rgba(143,178,122,.08)}
.slot .n{font-family:var(--mono);color:var(--pumpkin);font-weight:700}
.arrow-row{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}

.center{text-align:center}
.big-emoji{font-size:3.6rem;line-height:1}
.stats{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 16px}
.stat .k{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.stat .v{font-family:var(--mono);font-size:1.25rem;color:var(--gold)}
.host-intro{display:flex;gap:18px;align-items:center;margin:14px 0;flex-wrap:wrap}
.host-intro img{width:130px;height:130px}
footer{margin-top:18px;text-align:center;font-size:.72rem;color:#8a7360}
@media (max-width:640px){
  .card,.modal-card{padding:18px 16px}
  .narr .portrait{width:48px;height:48px}
  .stat-row{gap:10px}
  .slot{font-size:.62rem;min-height:66px}
}
</style>
</head>
<body>
<div id="leaves" aria-hidden="true"></div>
<div id="toast" role="status"></div>
<div id="modal" role="dialog" aria-modal="true"><div class="modal-card" id="modalCard"></div></div>

<div id="app">
  <header class="hud" id="hud" hidden>

function h(s){let x=2166136261; s='HT~'+s; for(let i=0;i<s.length;i++){x^=s.charCodeAt(i); x=Math.imul(x,16777619);} return (x>>>0).toString(36);}
function digits(s){return String(s).replace(/[^0-9]/g,'');}
function rng(seed){return ()=>(seed=(seed*16807)%2147483647)/2147483647;}
const $=s=>document.querySelector(s);

const MOODS=['happy','worried','nervous','delighted'];
const AVATARS={}, AVATARS_NB={};
MOODS.forEach(m=>{AVATARS[m]=`data:image/svg+xml,${encodeURIComponent(avatarSVG(true,m))}`; AVATARS_NB[m]=`data:image/svg+xml,${encodeURIComponent(avatarSVG(false,m))}`;});
const AVATAR=AVATARS.happy, AVATAR_NB=AVATARS_NB.happy;
const DOG=`data:image/svg+xml,${encodeURIComponent(dogSVG())}`;
const R=t=>`<div class="say"><img src="${AVATAR}" alt="Reshawndra"><div><b>Reshawndra Hutchins-Trapp:</b> ${t}</div></div>`;
const G=t=>`<div class="say ai"><span class="bot">🤖</span><div><b>G.O.B.B.L.E.:</b> ${t}</div></div>`;

/* =========================================================
   AUDIO: music, room ambience, sound effects
   ========================================================= */
const SFX=(()=>{
  let ctx=null, master, musicBus, sfxBus, ambBus, longNoise;
  let schedId=null, step=0, nextTime=0, musicOn=true, ambOn=true, ambLoops=[], ambNodes=[], ambKind=null;
  const BPM=118, EIGHTH=60/BPM/2;
  const MEL=[[67,2],[71,1],[74,1],[79,2],[74,2],[76,2],[74,1],[72,1],[71,2],[69,2],[66,1],[69,1],[74,2],[72,1],[71,1],[69,2],[71,2],[67,2],[67,4],
    [71,1],[74,1],[76,2],[79,2],[76,2],[72,1],[76,1],[74,2],[72,2],[71,2],[69,2],[74,2],[78,2],[76,1],[78,1],[79,4],[0,2],[74,2],
    [72,2],[76,2],[79,3],[76,1],[74,2],[71,2],[67,4],[69,1],[72,1],[76,2],[74,1],[72,1],[69,2],[66,2],[69,2],[74,4],
    [76,1],[74,1],[72,2],[76,1],[74,1],[72,2],[71,1],[74,1],[79,2],[78,1],[76,1],[74,2],[72,2],[71,2],[69,2],[66,2],[67,6],[0,2]];
  const CH={G:{r:43,t:[55,59,62]},C:{r:48,t:[55,60,64]},D:{r:50,t:[57,62,66]},Em:{r:40,t:[55,59,64]},Am:{r:45,t:[57,60,64]}};
  const PROG=['G','C','D','G','Em','C','D','G','C','G','Am','D','C','G','D','G'];
  const STEPS=PROG.length*8, song=Array.from({length:STEPS},()=>[]);
  (()=>{let s=0; for(const [m,l] of MEL){ if(m) song[s].push({t:'mel',m,l}); s+=l; }
    PROG.forEach((c,bar)=>{const b=bar*8,ch=CH[c]; song[b].push({t:'bass',m:ch.r,l:3}); song[b+4].push({t:'bass',m:ch.r+7,l:3});
      [2,6].forEach(o=>ch.t.forEach(n=>song[b+o].push({t:'chord',m:n,l:1.4})));});
    for(let i=0;i<STEPS;i++) song[i].push({t:'shk',acc:i%2===1});})();
  const f=m=>440*Math.pow(2,(m-69)/12);
  function tone(m,t,dur,type,vol,dest,attack=0.012){
    const o=ctx.createOscillator(),g=ctx.createGain(); o.type=type; o.frequency.setValueAtTime(f(m),t);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+attack); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g).connect(dest); o.start(t); o.stop(t+dur+0.05);
  }
  function sweep(f0,f1,t,dur,vol,type='sine',dest=ambBus){
    const o=ctx.createOscillator(),g=ctx.createGain(); o.type=type; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+dur);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g).connect(dest); o.start(t); o.stop(t+dur+0.05);
  }
  function nz(t,dur,vol,type,freq,dest,attack=0.003){
    const s=ctx.createBufferSource(); s.buffer=longNoise;
    const fl=ctx.createBiquadFilter(); fl.type=type; fl.frequency.value=freq;
    const g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+attack); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(fl).connect(g).connect(dest); s.start(t,Math.random()*1.5,dur+0.05);
  }
  function loopNoise(type,freq,q,vol){
    const s=ctx.createBufferSource(); s.buffer=longNoise; s.loop=true;
    const fl=ctx.createBiquadFilter(); fl.type=type; fl.frequency.value=freq; fl.Q.value=q;
    const g=ctx.createGain(); g.gain.value=vol; s.connect(fl).connect(g).connect(ambBus); s.start(); ambNodes.push(s); return g;
  }
  function every(min,max,fn){
    const L={id:null}; const run=()=>{ fn(ctx.currentTime+0.03); L.id=setTimeout(run,(min+Math.random()*(max-min))*1000); };

function censusChart(){
  const data=[20,32,52,85,135,205,285,360,430,455,420,380,395,410,400];
  const W=660,H=360,L=64,Rr=20,T=36,B=56,pw=W-L-Rr,ph=H-T-B, x=i=>L+i*pw/14, y=v=>T+ph-(v/500)*ph;
  let g='';
  for(let v=0;v<=500;v+=50){const major=v%100===0; g+=`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" class="grid${major?'':' minor'}"/>`; if(major) g+=`<text x="${L-10}" y="${y(v)+4}" text-anchor="end" class="axl">${v}</text>`;}
  for(let i=0;i<=14;i++) g+=`<text x="${x(i)}" y="${H-B+20}" text-anchor="middle" class="axl">${i}</text>`;
  g+=`<line x1="${L}" x2="${L}" y1="${T}" y2="${T+ph}" class="axis"/><line x1="${L}" x2="${W-Rr}" y1="${T+ph}" y2="${T+ph}" class="axis"/>`;
  const path=data.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ');
  const dots=data.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="5" class="dot"><title>Year ${i}: ${v} turkeys</title></circle>`).join('');
  g+=`<text x="${L+pw/2}" y="${H-12}" text-anchor="middle" class="axt">Years since introduction</text>`;
  g+=`<text transform="translate(18,${T+ph/2}) rotate(-90)" text-anchor="middle" class="axt">Wild turkey population (individuals)</text>`;
  g+=`<text x="${L}" y="20" class="axt" fill="#e8b44a">G.O.B.B.L.E. CENSUS · Hutchins-Trapp Island · Meleagris gallopavo</text>`;
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Line graph: wild turkey population starts at 20, rises slowly then rapidly, peaks at 455 in year 9, drops to 380 in year 11, then settles near 400.">${g}<path d="${path}" class="line"/>${dots}</svg></div>`;
}
function pyramid(w,color){
  const W=200,H=170,rowH=16,cx=100,base=H-22; let s='';
  w.forEach((v,i)=>{const yy=base-(i+1)*rowH,half=v*0.82;
    s+=`<rect x="${cx-half}" y="${yy}" width="${half-1.5}" height="${rowH-3}" rx="2" fill="${color}"/><rect x="${cx+1.5}" y="${yy}" width="${half-1.5}" height="${rowH-3}" rx="2" fill="${color}" opacity=".65"/>`;});
  s+=`<line x1="${cx}" x2="${cx}" y1="${base-8*rowH-4}" y2="${base}" class="axis"/>`;
  s+=`<text x="4" y="${base-8*rowH+8}" class="axl" style="font-size:10px">80+</text><text x="4" y="${base-4}" class="axl" style="font-size:10px">0–9</text>`;
  s+=`<text x="${cx-6}" y="${H-6}" text-anchor="end" class="axl" style="font-size:10px">Male</text><text x="${cx+6}" y="${H-6}" class="axl" style="font-size:10px">Female</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" class="pyr" role="img" aria-label="Age structure diagram">${s}</svg>`;
}

function cornStalk(x,base,top,lean,s,col,leafCol){
  let g=`<path d="M${F(x)},${base} Q${F(x+lean)},${F((base+top)/2)} ${F(x+lean*2)},${F(top)}" stroke="${col}" stroke-width="${F(4.5*s)}" fill="none" stroke-linecap="round"/>`;
  for(let k=0;k<5;k++){
    const t=0.25+k*0.15, yy=base+(top-base)*t, xx=x+lean*2*t, d=k%2?1:-1, L=(48+k*4)*s;
    g+=`<path d="M${F(xx)},${F(yy)} q${F(d*L*0.55)},${F(-L*0.35)} ${F(d*L)},${F(L*0.25)} q${F(-d*L*0.45)},${F(-L*0.3)} ${F(-d*L)},${F(-L*0.25)}z" fill="${leafCol}"/>`;
    g+=`<path d="M${F(xx)},${F(yy)} q${F(d*L*0.5)},${F(-L*0.3)} ${F(d*L)},${F(L*0.25)}" stroke="#d8f0a0" stroke-width="${F(0.8*s)}" fill="none" opacity=".45"/>`;
  }
  g+=`<path d="M${F(x+lean*2)},${F(top)} l${F(-6*s)},${F(-18*s)} M${F(x+lean*2)},${F(top)} l${F(5*s)},${F(-20*s)} M${F(x+lean*2)},${F(top)} l0,${F(-24*s)}" stroke="#c9b26a" stroke-width="${F(1.6*s)}"/>`;
  return g;
}

function artForest(){
  const r=rng(23);
  let far='', litter='', leaves='';
  for(let i=0;i<18;i++){const x=r()*1000, w=8+r()*10; far+=`<rect x="${F(x)}" y="80" width="${F(w)}" height="400" fill="#3a4a4a"/>`;}
  for(let i=0;i<260;i++) litter+=`<ellipse cx="${(r()*1000)|0}" cy="${F(466+r()*94)}" rx="${F(2+r()*5)}" ry="${F(1+r()*1.6)}" transform="rotate(${(r()*180)|0} 0 0)" fill="${['#9a4a1d','#c27a2b','#6b3a1a','#b5562a','#d69a3a','#5a2a12'][i%6]}" opacity=".9"/>`;
  litter=litter.replace(/transform="rotate\((\d+) 0 0\)"/g,'');
  for(let i=0;i<9;i++) leaves+=`<path class="fallleaf" style="--x:${F(100+r()*800)}px;animation-delay:-${F(r()*10)}s;animation-duration:${F(8+r()*6)}s" d="M0,0 q6,-6 12,0 q-6,6 -12,0z" fill="${['#d69a3a','#b5562a','#9a4a1d'][i%3]}"/>`;
  const canopyFlat=(cx,cy,R,cols)=>{let g=''; for(let k=0;k<9;k++){const a=k/9*Math.PI*2, rr=R*(0.55+r()*0.3); g+=`<circle cx="${F(cx+Math.cos(a)*R*0.55)}" cy="${F(cy+Math.sin(a)*R*0.3)}" r="${F(rr)}" fill="${cols[k%cols.length]}"/>`;} return g;};

function fmt(s){s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function foodLine(s){const m=s/60;
  if(m>=40) return '🦃 The turkey is resting. The gravy is glossy. All is well… for now.';
  if(m>=30) return '🥧 The pumpkin pie has begun to weep, just slightly.';
  if(m>=20) return '🍠 The sweet potato soufflé is trembling.';
  if(m>=10) return '🫙 The cranberry sauce is forming a skin. Oxygen scrubbers at 40%.';
  if(m>=5)  return '⚠️ The dinner rolls are going stale. Oxygen scrubbers at 15%.';
  return '🚨 The soufflé is collapsing! The cranberry sauce is turning to rock!';}

const ANNOUNCE={2400:'Oxygen scrubbers at 80%. The gravy remains glossy.',1800:'Thirty minutes remain. The pumpkin pie is weeping.',1200:'Twenty minutes. The soufflé has begun to tremble.',600:'TEN MINUTES. Oxygen scrubbers at 40%. Cranberry sauce is congealing.',300:'FIVE MINUTES. This is not a drill. Well, it is a party game, but it is also not a drill.',60:'SIXTY SECONDS.'};
function tick(){
  if(S.over) return;
  S.secs--; updateHUD(); updateDim(); SFX.heart(S.secs<300&&!S.hasKey);
  if(S.secs===599) setMood('nervous');
  { let pick=null; for(const k in ANNOUNCE){ if(S.secs<=+k && !S.announced.has(k)){ S.announced.add(k); if(pick===null||+k<+pick) pick=k; } } if(pick!==null){ toast(`🤖 <b>G.O.B.B.L.E.:</b> ${ANNOUNCE[pick]}`); if(+pick<=600) SFX.alarm(); } }
  if(S.secs<=S.flickerAt){ const w=$('.scene-wrap'); if(w){w.classList.remove('flicker'); void w.offsetWidth; w.classList.add('flicker');} S.flickerAt=S.secs-(S.secs<600?12+Math.random()*15:30+Math.random()*40); }
  if(S.secs<=0) lose('time');
}

function spotState(sp){
  if(sp.kind==='clue') return S.clues.includes(sp.clue)?'done':'';
  if(sp.kind==='flavor'||sp.kind==='pup') return S.seen.has(sp.id)?'done':'';
  if(sp.kind==='lock') return S.lock>sp.lock?'done lock':'lock';
  if(sp.kind==='door') return 'door';
  if(sp.kind==='exit') return S.hasKey?'lock':'door';
  return S.seen.has(sp.id)?'done':'';
}

function enterRoom(id,instant){

    const c=$('#cam'); c.classList.remove('push'); void c.offsetWidth; c.classList.add('push'); };
  window.scrollTo({top:0,behavior:'smooth'});
  if(instant){ SFX.walk(); go(); return; }
  S.trans=true; SFX.door(); SFX.walk(); $('#fade').classList.add('on');

}

function onSpot(id){
  if(S.over) return;
  const sp=ROOMS[S.room].spots.find(s=>s.id===id); if(!sp) return;
  if(sp.kind==='clue'){
    const c=CLUES[sp.clue], isNew=!S.clues.includes(sp.clue);
    if(isNew){ S.clues.push(sp.clue); SFX.found(); setMood('delighted',2200); toast(`📓 Added to your Field Journal: <b>${c.title}</b>`); updateHUD(); renderScene(); }
    openModal(`<div class="kicker">${c.room} · Clue ${isNew?'found':'(in journal)'}</div><h2>${c.title}</h2>${c.html()}<div class="center"><button class="primary" onclick="closeModal()">Keep exploring</button></div>`);
  } else if(sp.kind==='pup'){
    S.seen.add(id); SFX.bark(); renderScene();
    openModal(`<div class="kicker">${ROOMS[S.room].name}</div><div class="host-intro"><img src="${DOG}" alt="" style="width:90px;height:90px"><h2 style="margin:0">Reshawndra's pup</h2></div><p>${sp.text()}</p><div class="center"><button class="primary" onclick="closeModal()">Good pup. Keep exploring</button></div>`);
  } else if(sp.kind==='flavor'){
    S.seen.add(id); if(id==='dog') SFX.bark(); renderScene();
    openModal(`<div class="kicker">${ROOMS[S.room].name}</div><h2>${sp.label}</h2><p>${sp.text()}</p><div class="center"><button class="primary" onclick="closeModal()">Keep exploring</button></div>`);
  } else if(sp.kind==='door'){
    if(sp.need!==undefined && S.lock<=sp.need) openModal(`<h2>${sp.label}</h2><p>${sp.sealed}</p>`);
    else enterRoom(sp.to);
  } else if(sp.kind==='lock'){
    if(S.lock>sp.lock){ const nx=LOCKS[sp.lock].next; if(nx!=='dining'||S.room!=='study') enterRoom(nx); else openModal(`<h2>The vault</h2><p>The vault stands open and empty. You already have the key!</p>`); }
    else openLock(sp.lock);
  } else if(sp.kind==='exit'){
    if(S.hasKey) return finale();
    openModal(`<h2>Main exit doors</h2><p>A steel shutter seals the exit. Above it, <b>${S.lock} of 4</b> lights glow green. Below the handle is a slot shaped like… a drumstick?</p>${G(`The main exit opens only with the <b>master override key</b>, which is stored in the vault in Reshawndra's study.`)}`);
  } else if(sp.kind==='console'){
    const o2=Math.round(20+80*S.secs/START_SECONDS);
    openModal(`<h2>G.O.B.B.L.E. console</h2><div class="terminal"><div class="hdr">CONTAINMENT STATUS</div>Biometric locks opened: ${S.lock} / 4<br>Main exit: ${S.hasKey?'OVERRIDE KEY DETECTED':'SEALED (requires master override key)'}<br>Oxygen scrubbers: ${o2}%<br>Wrong-answer tolerance remaining: ${MAX_WRONG-S.wrong}<br>Field data collected: ${S.clues.length} / ${Object.keys(CLUES).length}</div>${G(`I only open doors for people who understand ecology, Doctor. Gather data before you guess.`)}`);
  } else if(sp.kind==='host'){
    const lines=[`The greenhouse is through that door. I keep instruments all over it, because I measure <i>everything</i>. And don't skip the turkey! I had the platter engraved.`,
      `The Forest Wing! I let twenty wild turkeys loose in there years ago. G.O.B.B.L.E. counts them every single year.`,
      `My poor orchard. It burned last October. Please don't ask about the candle.`,
      `My study is past the orchard. The master override is in the vault, behind a code about… nations? I wrote it after a long flight.`,
      `You have the key! The main exit, Doctor, quickly, before the soufflé gives up!`];
    openModal(`<h2>Reshawndra Hutchins-Trapp</h2>${R(lines[S.hasKey?4:S.lock])}<p style="color:var(--muted);font-size:.85rem">Tip: the 🎩 <b>Ask Reshawndra</b> button gives you a real hint anywhere, for 2 minutes off the clock.</p>`);
  } else if(sp.kind==='souffle'){
    openModal(`<h2>Sweet potato soufflé</h2><p>The soufflé ${S.secs>1800?'stands proud and golden':'is visibly losing its will to rise'}. ${foodLine(S.secs)}</p><p><i>It is, technically, a timer now.</i></p>`);
  }
}

function missing(i){ return LOCKS[i].requires.filter(c=>!S.clues.includes(c)); }
function openLock(i){
  const L=LOCKS[i]; if(S.modalLock!==i){ S.order=[]; } S.modalLock=i;
  const miss=missing(i);
  const found=L.related.filter(c=>S.clues.includes(c));
  const field=`<div class="casefile"><div class="cf-hdr">📁 CASE FILE: data you've collected for this lock</div>${found.map(c=>`<div class="cf-item">${CLUES[c].brief()}</div>`).join('')}
    ${L.related.filter(c=>!S.clues.includes(c)).length?`<div class="cf-more">There may be more useful clues around the estate.</div>`:''}</div>`;
  let body;
  if(miss.length){
    body=`<div class="offline">🔒 <b>KEYPAD OFFLINE.</b> Field data collected for this lock: ${L.requires.length-miss.length} of ${L.requires.length}.</div>
      <div class="casefile"><div class="cf-hdr">📋 DATA NEEDED TO ACTIVATE THIS KEYPAD</div>${L.requires.map(c=>S.clues.includes(c)
        ?`<div class="cf-item ok">✅ <b>${CLUES[c].title}</b>: ${CLUES[c].brief()}</div>`
        :`<div class="cf-item miss">🔍 <b>Missing clue</b>: search the <b>${CLUES[c].room}</b> and examine the glowing objects.</div>`).join('')}</div>
      ${G(`Insufficient field data, Doctor. Explore the estate and examine everything before you guess. Guessing blind wastes oxygen.`)}`;
  } else {
    body=`${field}<div class="terminal"><div class="prompt">${L.prompt}</div></div>
      ${L.type==='text'
        ?`<form class="answer" id="ansForm" autocomplete="off"><input id="ans" placeholder="${L.placeholder}" aria-label="${L.placeholder}"><button class="primary" type="submit">Submit ▶</button></form>`
        :`<p style="margin:6px 0 0;font-size:.82rem;color:var(--muted)">Tap the holograms to place them in order. Tap a filled slot to remove it.</p><div class="cards" id="plantCards"></div><div class="arrow-row"><span>◀ First to arrive</span><span>Final community ▶</span></div><div class="slots" id="slots"></div>
          <div class="answer"><button class="ghost" id="resetOrder" type="button">↺ Reset</button><button class="primary" id="submitOrder" type="button" disabled>Submit sequence ▶</button></div>`}`;
  }
  openModal(`<div class="kicker">Lock ${i+1} of 4 · ${ROOMS[L.room].name}</div><h2>${L.title}</h2><span class="unit-tag">${L.unit}</span>${body}
    <div style="margin-top:12px"><button class="small ghost" type="button" onclick="askReshawndra()">🎩 Ask Reshawndra for a hint (−2 min)</button></div><div id="log"></div>`);
  if(!miss.length){
    if(L.type==='text'){ $('#ansForm').onsubmit=e=>{e.preventDefault(); const v=$('#ans').value.trim(); if(v) submit(v);}; setTimeout(()=>$('#ans')&&$('#ans').focus(),50); }
    else setupOrder(L);
  }
}
function setupOrder(L){
  const draw=()=>{
    $('#plantCards').innerHTML=L.plants.map(p=>`<button type="button" class="plant${S.order.includes(p.id)?' used':''}" data-id="${p.id}"><span class="ico">${p.ico}</span>${p.txt}</button>`).join('');
    $('#slots').innerHTML=Array.from({length:5},(_,i)=>{const p=L.plants.find(x=>x.id===S.order[i]);
      return `<div class="slot${p?' filled':''}" data-i="${i}" role="button" tabindex="0"><span class="n">${i+1}</span>${p?`<span style="font-size:1.2rem">${p.ico}</span>${p.txt.split(':')[0]}`:'—'}</div>`;}).join('');
    document.querySelectorAll('.plant').forEach(b=>b.onclick=()=>{ if(S.order.length<5){S.order.push(b.dataset.id); draw();} });
    document.querySelectorAll('.slot.filled').forEach(s=>s.onclick=()=>{ S.order.splice(+s.dataset.i,1); draw(); });
    $('#submitOrder').disabled=S.order.length<5;
  };
  draw(); $('#resetOrder').onclick=()=>{S.order=[]; draw();}; $('#submitOrder').onclick=()=>submit(S.order.join(''));
}
function logMsg(html){ const log=$('#log'); if(!log) return openModal(html); const d=document.createElement('div'); d.innerHTML=html; log.prepend(d); }
function currentLockIndex(){ return S.hasKey?null:S.lock; }
function askReshawndra(){
  if(S.over) return;
  S.secs=Math.max(1,S.secs-HINT_COST_SECONDS); S.hintsUsed++; updateHUD(); SFX.hint();
  const i=currentLockIndex(); let msg;
  if(i===null) msg=R(`The key, Doctor! Take it to the <b>main exit in the Dining Hall</b>!`);
  else { const miss=missing(i);
    if(miss.length) msg=R(CLUES[miss[0]].where+` <span style="color:var(--muted)">(${CLUES[miss[0]].room})</span>`);
    else { const L=LOCKS[i]; msg=L.hints[Math.min(S.hintIdx,L.hints.length-1)]; S.hintIdx++; } }
  const out=`<div style="font-size:.72rem;color:var(--muted)">⏳ −2 minutes</div>${msg}`;
  if($('#modal').classList.contains('open') && $('#log')) logMsg(out); else openModal(`<h2>🎩 A word from your host</h2>${out}`);
}
function submit(v){
  if(S.over) return;
  const i=S.lock, L=LOCKS[i];
  const ok=L.check?L.check(v):(L.type==='order'?h(v)===L.hash:h(digits(v))===L.hash);
  if(ok) return solved(i);
  S.wrong++; updateHUD(); SFX.wrong(); setMood('worried',7000);
  const card=$('#modalCard'); card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
  if(S.wrong>=MAX_WRONG) return lose('guesses');
  const left=MAX_WRONG-S.wrong, key=L.type==='order'?null:digits(v), sp=key&&L.specific[key];
  let hint; if(sp) hint=G(sp); else { hint=L.hints[Math.min(S.hintIdx,L.hints.length-1)]; S.hintIdx++; }
  logMsg(`<div class="offline" style="margin-top:10px"><b>ACCESS DENIED.</b> ${left} wrong guess${left===1?'':'es'} left before the feast is ruined.</div>${hint}`);
  if($('#ans')) $('#ans').select();
}
function solved(i){
  const L=LOCKS[i]; S.lock++; S.hintIdx=0; S.order=[]; SFX.unlock(); updateHUD();
  if(i===3){ S.hasKey=true; SFX.vault(); SFX.heart(false); }
  setMood('delighted',i===3?0:6000); updateDim();
  const btn=i===3?'🗝️ Run back to the Dining Hall':`Go through to the ${ROOMS[L.next].name} ▶`;
  openModal(`<div class="kicker">🔓 Lock ${i+1} of 4 open</div><h2>${L.title}: Solved!</h2>${L.success}
    ${i===3?R(`You did it! The <b>main exit in the Dining Hall</b>, Doctor. Hurry!`):''}
    <div class="center"><button class="primary" id="goNext">${btn}</button></div>`);
  $('#goNext').onclick=()=>enterRoom(L.next);
  renderMap(); renderScene();
}
function finale(){
  openModal(`<h2>The Main Exit</h2><p>You slide the drumstick-shaped key into the slot. Four green lights blaze. Somewhere deep in the dome, a turbine spins up…</p>${G(`Ecological literacy confirmed. Containment protocol disengaged. Happy Thanksgiving, Doctor.`)}<div class="center"><button class="primary" onclick="win()">Step outside ▶</button></div>`);
}
function showJournal(){
  const items=S.clues.map(c=>`<details class="field"><summary>📓 ${CLUES[c].title} <span style="color:var(--muted);font-weight:400">· ${CLUES[c].room}</span></summary>${CLUES[c].html()}</details>`).join('');
  openModal(`<div class="kicker">Field Journal</div><h2>📓 Your notes</h2>${items||'<p>Nothing yet. Examine objects around the estate to collect clues.</p>'}`);
}

/* =========================================================
   ENDINGS
   ========================================================= */
function win(){
  S.over=true; clearInterval(S.timerId); closeModal(); SFX.win(); updateHUD();
  $('#screen').innerHTML=`<section class="card center">
    <div class="host-intro" style="justify-content:center"><img src="${AVATAR}" alt="Reshawndra"><img src="${DOG}" alt="Pup" style="width:90px;height:90px"></div>
    <h1>You <span class="accent">Escaped!</span></h1>
    <div style="text-align:left">
      <p>Every shutter in the dome rolls up at once. Fresh Atlantic air pours in, and the oxygen scrubbers hum back to life. In the dining hall, the sweet potato soufflé is <i>still standing</i>, and the pup is already doing a victory lap around the table.</p>
      ${R(`Magnificent! You must stay for dinner. And honestly, for the rest of your career. I'm naming the new wetland preserve after you.`)}
    </div>
    <div class="stats"><div class="stat"><div class="k">Time remaining</div><div class="v">${fmt(S.secs)}</div></div><div class="stat"><div class="k">Wrong guesses</div><div class="v">${S.wrong} / ${MAX_WRONG}</div></div><div class="stat"><div class="k">Hints bought</div><div class="v">${S.hintsUsed}</div></div><div class="stat"><div class="k">Clues found</div><div class="v">${S.clues.length} / ${Object.keys(CLUES).length}</div></div></div>
    <h3>Concepts mastered</h3>
    <ul style="text-align:left;max-width:620px;margin:8px auto">
      <li>🌽 <b>Unit 1:</b> GPP vs. NPP and the 10% rule across trophic levels</li>
      <li>🦃 <b>Unit 3:</b> Logistic growth, overshoot, die-off and carrying capacity</li>
      <li>🌲 <b>Unit 2:</b> Secondary succession from pioneers to climax community</li>
      <li>🌍 <b>Unit 3:</b> The Demographic Transition Model, TFR and age structure</li>
    </ul><button class="primary" id="again">Play again</button></section>`;
  $('#again').onclick=startGame; window.scrollTo({top:0});
}
function lose(reason){
  S.over=true; clearInterval(S.timerId); closeModal(); SFX.lose(); updateHUD();
  const why=reason==='time'
    ?`The clock hits <b>00:00</b>. The sweet potato soufflé folds in on itself with a sad little <i>pfft</i>. The cranberry sauce has hardened into rock, and the oxygen scrubbers click off.`
    :`A third <b>ACCESS DENIED</b> echoes through the dome. In the dining hall, the sweet potato soufflé collapses, and the gravy grows a skin thick enough to walk on.`;
  $('#screen').innerHTML=`<section class="card center"><div class="big-emoji">🥀🍠💨</div><h1>The Feast Is <span class="accent">Ruined</span></h1>
    <div style="text-align:left"><p>${why}</p>
      ${G(`Insufficient ecological literacy detected. Initiating backup protocol: <i>ordering takeout</i>. Estimated delivery to a remote island: three to five business days.`)}
      ${R(`Well… there's always the compost pile. Lovely nitrogen cycling in there.`)}</div>
    <div class="stats"><div class="stat"><div class="k">Locks opened</div><div class="v">${S.lock} / 4</div></div><div class="stat"><div class="k">Clues found</div><div class="v">${S.clues.length} / ${Object.keys(CLUES).length}</div></div></div>
    <p style="color:var(--muted)">Review your notes and try again. The turkeys are counting on you.</p><button class="primary" id="again">Try again</button></section>`;
  $('#again').onclick=startGame; window.scrollTo({top:0});
}

/* =========================================================
   CONTROLS & AMBIENCE
   ========================================================= */
$('#journalBtn').onclick=showJournal;
$('#askBtn').onclick=askReshawndra;
$('#musicBtn').onclick=()=>{ SFX.init(); const on=SFX.toggleMusic(); $('#musicBtn').textContent=on?'🎵 Music':'🔇 Music'; };
$('#ambBtn').onclick=()=>{ SFX.init(); const on=SFX.toggleAmb(); $('#ambBtn').textContent=on?'🌿 Sounds':'🔇 Sounds'; };
$('#vol').oninput=e=>SFX.setVol(e.target.value/100);
(function leaves(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box=$('#leaves'), icons=['🍂','🍁','🍂','🌾'];
  for(let i=0;i<12;i++){const l=document.createElement('span'); l.className='leaf'; l.textContent=icons[i%4];
    l.style.left=Math.random()*100+'vw'; l.style.animationDuration=(12+Math.random()*14)+'s'; l.style.animationDelay=(-Math.random()*20)+'s'; l.style.fontSize=(14+Math.random()*12)+'px'; box.appendChild(l);}
})();
renderIntro();
</script>
</body>
