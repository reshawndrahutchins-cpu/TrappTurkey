<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Turkey Day Trophic Trap · Hutchins-Trapp Estate Escape Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700;9..144,900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="leaves" aria-hidden="true"></div>

<div id="app">
  <header class="hud" id="hud" hidden>
    <div class="estate">The Hutchins-Trapp Estate<small>Turkey Day Trophic Trap</small></div>
    <div class="hud-item"><span class="label">Locks</span><span class="val" id="locks"></span></div>
    <div class="hud-item"><span class="label">Wrong guesses</span><span class="val" id="lives"></span></div>
    <div class="hud-item"><span class="label">Feast countdown</span><span id="timer">45:00</span></div>
    <div class="audio">
      <button class="small ghost" id="musicBtn" aria-pressed="true">🎵 Music on</button>
      <input type="range" id="vol" min="0" max="100" value="55" aria-label="Volume">
    </div>
    <div id="foodStatus"></div>
  </header>

  <main id="screen" aria-live="polite"></main>
  <footer>An AP Environmental Science escape room (Units 1–3). The music is generated in your browser, so there are no audio files to load.</footer>
</div>

<script src="game.js"></script>
</body>
</html>
